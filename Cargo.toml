[package]
name = "asterlane"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Agent-native gateway for third-party API and MCP resource credentials"
license = "MIT"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"

[features]
default = []
otlp = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_norway = "0.9"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
secrecy = { version = "0.10" }
zeroize = "1.9"
tokio = { version = "1.53", features = ["full"] }
axum = "0.8"
tower = { version = "0.5", features = ["util", "timeout"] }
tower-http = { version = "0.7", features = ["trace", "set-header"] }
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
governor = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "3.1", default-features = false, features = ["client", "server", "macros", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
schemars = "1.2"
tokio-util = "0.7"
backon = "1.6"
openapiv3 = "2.2"
sha2 = "0.11"
rand = "0.10"
opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "reqwest-client", "trace"], optional = true }
tracing-opentelemetry = { version = "0.33", optional = true }

[dev-dependencies]
wiremock = "0.6"
