name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - name: Contract drift
        run: cargo run --example export_admin_schema -- --check schemas/admin.json

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: python3 scripts/check_okf_docs.py
      - run: python3 scripts/setup_worktree.py --check-env-schema

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Docker 镜像构建（不推送）
        run: docker build --tag asterlane:ci .
      - name: Docker 镜像冒烟
        run: docker run --rm asterlane:ci --help

  k8s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # ubuntu runner 自带 kubectl，kustomize 内置在 kubectl 里。只渲染，不连集群。
      - name: 渲染 K8s 清单
        run: |
          set -euo pipefail
          cmp deploy/k8s/config.yaml run.yaml
          kubectl kustomize deploy/k8s > "${RUNNER_TEMP}/asterlane-k8s.yaml"
          grep -q 'image: ghcr.io/komiyoo/asterlane:0.1.0' "${RUNNER_TEMP}/asterlane-k8s.yaml"
          grep -q 'image: ghcr.io/komiyoo/asterlane-web:0.1.0' "${RUNNER_TEMP}/asterlane-k8s.yaml"
          grep -q 'replicas: 1' "${RUNNER_TEMP}/asterlane-k8s.yaml"
          if grep -E 'image:[[:space:]]+[^[:space:]]+:latest([[:space:]]|$)' "${RUNNER_TEMP}/asterlane-k8s.yaml"; then
            echo "::error::清单使用了 latest 标签"
            exit 1
          fi
