name: Deploy smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust-image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Build gateway image
        run: docker build --build-arg GIT_COMMIT=${{ github.sha }} -t asterlane:ci .
      - name: Gateway image has no frontend toolchain
        run: |
          docker run --rm --entrypoint sh asterlane:ci -c 'if command -v node >/dev/null || command -v bun >/dev/null || command -v nginx >/dev/null; then exit 1; fi; test -x /usr/local/bin/asterlane'
          docker run --rm --entrypoint cat asterlane:ci /etc/asterlane-build-info > rust-build-info.txt
          grep -q "git_commit=${{ github.sha }}" rust-build-info.txt
      - name: Save gateway image
        run: docker save asterlane:ci | gzip -1 > asterlane-gateway.tar.gz
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: asterlane-gateway-image
          path: |
            asterlane-gateway.tar.gz
            rust-build-info.txt
          if-no-files-found: error
          retention-days: 1

  web-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build console image
        run: docker build -f web/Dockerfile --build-arg GIT_COMMIT=${{ github.sha }} -t asterlane-web:ci web
      - name: Console image has no Rust or JS toolchain
        run: |
          docker run --rm --entrypoint sh asterlane-web:ci -c 'if command -v node >/dev/null || command -v bun >/dev/null || command -v cargo >/dev/null; then exit 1; fi; test -s /usr/share/nginx/html/index.html'
          docker run --rm --entrypoint cat asterlane-web:ci /usr/share/nginx/html/build-info.json > web-build-info.json
          python3 -c 'import json; info=json.load(open("web-build-info.json")); assert info["git_commit"]=="${{ github.sha }}"; assert info["node"]=="22.23.1"; assert info["bun"]=="1.4.2"; assert info["vp"]=="1.0.0-rc.0"; assert info["nginx"]=="1.28.1"'
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: web-image-build-info-${{ github.sha }}
          path: web-build-info.json
          if-no-files-found: error
          retention-days: 1

  smoke:
    needs: rust-image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: asterlane-gateway-image
          path: /tmp/asterlane-images
      - name: Load gateway image
        run: gunzip -c /tmp/asterlane-images/asterlane-gateway.tar.gz | docker load
      - name: Deploy smoke
        run: ASTERLANE_SMOKE_GATEWAY_IMAGE=asterlane:ci bash scripts/web_deploy_smoke.sh
