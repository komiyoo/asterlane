name: Web

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          version: 1.0.0-rc.0
          node-version: 22.23.1
          working-directory: web
          cache: true
          cache-dependency-path: web/bun.lock
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Contract drift
        run: vp exec bun scripts/generate-api-types.ts --check
      - run: vp check
      - run: vp test --run
      - run: vp build
      - name: Stamp build info
        run: |
          python3 - <<'PY'
          import json, os
          info = {
              "git_commit": os.environ["GITHUB_SHA"],
              "node": "22.23.1",
              "bun": "1.4.2",
              "vp": "1.0.0-rc.0",
          }
          with open("dist/build-info.json", "w", encoding="utf-8") as handle:
              json.dump(info, handle)
          PY
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: web-dist-${{ github.sha }}
          path: web/dist
          if-no-files-found: error
