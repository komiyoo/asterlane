name: Release

# 推送 vX.Y.Z tag 时触发：校验版本 -> 原生构建二进制与镜像 -> 创建 GitHub Release。
# 步骤与首次发布注意事项见 docs/engineering/release-process.md。
# 发布产物不使用构建缓存，保证每次都是干净构建；只使用 GITHUB_TOKEN。

on:
  push:
    tags: ['v*.*.*']

env:
  CARGO_TERM_COLOR: always
  IMAGE_NAME: ghcr.io/komiyoo/asterlane

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: 校验 tag、Cargo.toml、Cargo.lock 与 CHANGELOG
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$TAG' 不是 vX.Y.Z 形式（暂不支持预发布后缀）"
            exit 1
          fi
          version="${TAG#v}"
          cargo_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          if [[ "$cargo_version" != "$version" ]]; then
            echo "::error::tag 版本 $version 与 Cargo.toml 的 version $cargo_version 不一致"
            exit 1
          fi
          lock_version="$(python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("Cargo.lock", "rb"))["package"] if p["name"] == "asterlane"))')"
          if [[ "$lock_version" != "$version" ]]; then
            echo "::error::Cargo.lock 中 asterlane 的版本 $lock_version 与 tag 版本 $version 不一致，请运行 cargo update --workspace 后提交"
            exit 1
          fi
          if ! awk -v v="$version" 'index($0, "## [" v "]") == 1 { found = 1 } END { exit !found }' CHANGELOG.md; then
            echo "::error::CHANGELOG.md 缺少 '## [$version]' 小节"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  binaries:
    needs: validate
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: 构建
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: 打包
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          "target/${TARGET}/release/asterlane" --help > /dev/null
          name="asterlane-${VERSION}-${TARGET}"
          mkdir -p "dist/${name}"
          cp "target/${TARGET}/release/asterlane" LICENSE README.md "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          cd dist
          if command -v sha256sum > /dev/null; then
            sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          else
            shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  image:
    needs: validate
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            os: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 按摘要推送单架构镜像
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.title=asterlane
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
      - name: 记录摘要
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image-manifest:
    needs: [validate, image]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 合成多架构 manifest 并打标签
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/digests"
          refs=()
          for digest in *; do
            refs+=("${IMAGE_NAME}@sha256:${digest}")
          done
          if [[ "${#refs[@]}" -ne 2 ]]; then
            echo "::error::预期 2 个架构的镜像摘要，实际 ${#refs[@]} 个"
            exit 1
          fi
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${VERSION}" \
            --tag "${IMAGE_NAME}:latest" \
            "${refs[@]}"
          docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}"

  release:
    needs: [validate, binaries, image-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: 从 CHANGELOG 抽取 Release 说明
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[A-Za-z0-9.]+\]: / { next }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md 的 [$VERSION] 小节没有内容"
            exit 1
          fi
      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -l dist
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-file notes.md
