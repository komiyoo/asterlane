schema_version: 1

# keyless hosted MCP。网关握手后会 listen tools/list_changed；
# Exa 工具集很少变，变更通知可能永不出现，周期 refresh 仍兜底。
mcp_servers:
  - id: exa-mcp
    domain: search
    provider: exa
    url: https://mcp.exa.ai/mcp
    description: Exa hosted MCP server proxied through Asterlane.

proxy_keys:
  - id: agent-search-mcp
    display_name: Search agent with Exa MCP tools
    allowed_tools:
      - '^search:exa:.*$'
    denied_tools: []
    default_tool_page_size: 20
