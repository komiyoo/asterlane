apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: asterlane-gateway-data
  labels:
    app.kubernetes.io/name: asterlane
    app.kubernetes.io/component: gateway
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # 事件表会持续增长。不写 storageClassName，使用集群的默认 StorageClass。
      storage: 1Gi
